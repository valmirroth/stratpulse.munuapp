<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ManuInd API — Documentação</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; }

    /* Top bar */
    .topbar-wrapper { background: #1e293b !important; padding: 12px 24px; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .topbar-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .topbar-logo-icon { background: #3b82f6; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .topbar-logo-icon svg { width: 20px; height: 20px; fill: white; }
    .topbar-title { color: white; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
    .topbar-subtitle { color: #94a3b8; font-size: .75rem; }
    .topbar-badge { margin-left: auto; background: #1d4ed8; color: white; font-size: .7rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; }

    /* Override swagger-ui defaults */
    .swagger-ui .topbar { display: none !important; }
    .swagger-ui .info { margin: 24px 0 8px; }
    .swagger-ui .info .title { font-size: 1.6rem; }
    .swagger-ui .scheme-container { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 12px 20px; }
    .swagger-ui .opblock-tag { font-size: .9rem; font-weight: 600; }
    .swagger-ui .opblock { border-radius: 8px !important; margin-bottom: 6px !important; box-shadow: 0 1px 3px rgba(0,0,0,.07) !important; }
    #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }

    /* Method colors */
    .swagger-ui .opblock-get    .opblock-summary-method { background: #2563eb; }
    .swagger-ui .opblock-post   .opblock-summary-method { background: #16a34a; }
    .swagger-ui .opblock-put    .opblock-summary-method { background: #d97706; }
    .swagger-ui .opblock-delete .opblock-summary-method { background: #dc2626; }

    .swagger-ui .opblock-get    { border-color: #bfdbfe; background: #eff6ff; }
    .swagger-ui .opblock-post   { border-color: #bbf7d0; background: #f0fdf4; }
    .swagger-ui .opblock-put    { border-color: #fde68a; background: #fffbeb; }
    .swagger-ui .opblock-delete { border-color: #fecaca; background: #fef2f2; }

    /* Hint bar */
    .hint-bar {
      max-width: 1200px; margin: 0 auto 0; padding: 12px 16px;
      background: #eff6ff; border-bottom: 1px solid #bfdbfe;
      color: #1e40af; font-size: .82rem; display: flex; align-items: center; gap: 8px;
    }
    .hint-bar strong { font-weight: 600; }
  </style>
</head>
<body>

  <!-- Custom top bar -->
  <div class="topbar-wrapper">
    <a class="topbar-logo" href="/">
      <div class="topbar-logo-icon">
        <!-- Wrench icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <div>
        <div class="topbar-title">ManuInd</div>
        <div class="topbar-subtitle">Gestão de Manutenção Industrial</div>
      </div>
    </a>
    <span class="topbar-badge">API v1.0.0</span>
  </div>

  <!-- Auth hint -->
  <div class="hint-bar">
    <strong>💡 Como autenticar:</strong>
    Execute <code>POST /api/auth/login</code> com <code>admin@manuind.com</code> / <code>Admin@123</code>,
    copie o <code>token</code> e cole em <strong>Authorize 🔒</strong> acima.
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      SwaggerUIBundle({
        url: '/docs/swagger.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset,
        ],
        layout: 'StandaloneLayout',
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 2,
        docExpansion: 'list',
        filter: true,
        tryItOutEnabled: true,
        persistAuthorization: true,
        requestInterceptor: (req) => {
          // Keep token across page reloads via localStorage
          const token = localStorage.getItem('swaggerToken')
          if (token && !req.headers['Authorization']) {
            req.headers['Authorization'] = 'Bearer ' + token
          }
          return req
        },
        onComplete: () => {
          // Persist auth token when user authorizes
          const origAuth = SwaggerUIBundle.SwaggerUIBundle
          document.addEventListener('click', (e) => {
            const btn = e.target.closest('.auth-btn-wrapper .btn.modal-btn.auth')
            if (btn) {
              setTimeout(() => {
                const inp = document.querySelector('.auth-container input[type="text"]')
                if (inp && inp.value) localStorage.setItem('swaggerToken', inp.value.replace(/^Bearer\s+/i, ''))
              }, 300)
            }
          })
        }
      })
    }
  </script>
</body>
</html>
